<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanctuary — 數位聖所</title>
  <meta name="description" content="AI 心理治療師系統 — 在安全的數位空間中，探索內心世界、緩解壓力、建立心理韌性。" />

  <!-- Google Fonts: Manrope + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Google Identity Services (OAuth) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Tailwind CSS Configuration mapped to tokens.css -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "var(--primary)",
            "on-primary": "var(--on-primary)",
            "primary-container": "var(--primary-container)",
            "on-primary-container": "var(--on-primary-container)",
            "secondary": "var(--secondary)",
            "on-secondary": "var(--on-secondary)",
            "secondary-container": "var(--secondary-container)",
            "on-secondary-container": "var(--on-secondary-container)",
            "tertiary": "var(--tertiary)",
            "on-tertiary": "var(--on-tertiary)",
            "tertiary-container": "var(--tertiary-container)",
            "on-tertiary-container": "var(--on-tertiary-container)",
            "error": "var(--error)",
            "on-error": "var(--on-error)",
            "error-container": "var(--error-container)",
            "on-error-container": "var(--on-error-container)",
            "background": "var(--background)",
            "on-background": "var(--on-background)",
            "surface": "var(--surface)",
            "on-surface": "var(--on-surface)",
            "surface-variant": "var(--surface-variant)",
            "on-surface-variant": "var(--on-surface-variant)",
            "outline": "var(--outline)",
            "surface-container-highest": "var(--surface-container-highest)",
            "surface-container-high": "var(--surface-container-high)",
            "surface-container": "var(--surface-container)",
            "surface-container-low": "var(--surface-container-low)",
            "surface-container-lowest": "var(--surface-container-lowest)"
          },
          fontFamily: {
            "headline": ["Manrope", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
